# index.html must always be revalidated; the other assets are not content-hashed,
# so they only get a short cache lifetime
map $uri $cache_control {
    /index.html                "no-cache";
    ~*\.(js|css|png|svg)$      "public, max-age=3600";
    default                    "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Requests arrive through the cloudflared container on the Docker network;
    # log the visitor's IP from Cloudflare instead of the tunnel's
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    add_header Cache-Control $cache_control;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Only allow framing by the site itself and the Hugging Face Space
    # (huggingface.co embeds *.hf.space, which embeds this site)
    add_header Content-Security-Policy "frame-ancestors 'self' https://huggingface.co https://*.hf.space" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
